<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Systems Circles™ Framework</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --accent: #01F9C6;
            --accent-dark: #00b894;
            --circle-comm: #CC3366;
            --circle-ops: #864871;
            --circle-finance: #1863DC;
            --circle-customer: #293C5B;
            --circle-marketing: #008000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-layout {
            max-width: 1152px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: center;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: visible;
        }

        /* Responsive wrapper centered for all mobile devices */
        .scaler-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            height: 300px;
            margin: 0 auto;
        }

        .scaler {
            transform: scale(0.58);
            transform-origin: center center;
            width: 490px;
            height: 490px;
            flex-shrink: 0;
        }

        .diagram-stage {
            position: relative;
            width: 490px;
            height: 490px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer Concentric Orbits */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            transition: all 0.35s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .orbit-security {
            width: 480px;
            height: 480px;
            border: 2px dashed rgba(0, 184, 148, 0.55);
            background: rgba(1, 249, 198, 0.03);
            z-index: 5;
        }
        .orbit-security:hover, .orbit-security.active-ring {
            border-color: #00b894;
            border-style: solid;
            box-shadow: 0 0 24px rgba(1, 249, 198, 0.45);
            background: rgba(1, 249, 198, 0.08);
        }

        .orbit-analytics {
            width: 414px;
            height: 414px;
            border: 2px dotted rgba(24, 99, 220, 0.55);
            background: rgba(24, 99, 220, 0.02);
            z-index: 6;
        }
        .orbit-analytics:hover, .orbit-analytics.active-ring {
            border-color: #1863DC;
            border-style: dashed;
            box-shadow: 0 0 24px rgba(24, 99, 220, 0.25);
            background: rgba(24, 99, 220, 0.06);
        }
